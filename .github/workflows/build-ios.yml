name: Build iOS IPA (TrollStore)

on:
  push:
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/PhoneMirror.xcodeproj \
            -scheme PhoneMirror \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA with TrollStore entitlements
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/PhoneMirror.app
          APPEX="$APP/PlugIns/Broadcast.appex"
          test -d "$APP" && test -d "$APPEX"
          ldid -Sios/Broadcast/Broadcast.entitlements "$APPEX/Broadcast"
          ldid -Sios/App/App.entitlements "$APP/PhoneMirror"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PhoneMirror.ipa Payload
          unzip -l PhoneMirror.ipa | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMirror-ipa
          path: PhoneMirror.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
