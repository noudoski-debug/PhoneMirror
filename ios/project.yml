name: PhoneMirror
options:
  bundleIdPrefix: com.phonemirror
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PhoneMirror:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: Broadcast
        embed: true
      - sdk: ReplayKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhoneMirror
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonemirror.app
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: Network.framework
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: PhoneMirror Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonemirror.app.broadcast
        SWIFT_OBJC_BRIDGING_HEADER: Broadcast-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Broadcast"]
